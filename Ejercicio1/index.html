<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOT Character Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
  <!-- Botón para alternar tema -->
  <button id="theme-toggle">🌞/🌚</button>

  <h1>Explora Personajes de Game of Thrones</h1>
  <p>Selecciona un personaje para ver sus datos.</p>

  <select id="character-list">
    <option value="">— Elige un personaje —</option>
  </select>

  <div id="image-container">
    <img id="character-image" src="" alt="">
  </div>

  <div id="info-container">
    <p id="name"><strong>Nombre:</strong> <span></span></p>
    <p id="title"><strong>Título:</strong> <span></span></p>
    <p id="family"><strong>Familia:</strong> <span></span></p>
  </div>
</body>
</html>
